<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 05</title>
</head>
<body>
    <h1>Exemplo de Formulário </h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend> Sexo </legend>
            <input type="radio" name="sexo" id="imasculino"> <label for="imasculino">Masculino</label> <br>
            <input type="radio" name="sexo" id="ifeminino"> <label for="ifeminino">Feminino</label> <br>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos </legend>
            <input type="checkbox" name="esportes" id="ifutebol"> <label for="ifutebol">Futebol</label> <br> 
            <input type="checkbox" name="esportes" id="ibasquete"> <label for="ibasquete">  Basquete</label> <br>
            <input type="checkbox" name="esportes" id="ivolei"> <label for="ivolei">Vôlei</label> <br>
            <input type="checkbox" name="esportes" id="inada"> <label for="inada">Natação</label> <br>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        </fieldset>
    </form>

</body>
</html>
